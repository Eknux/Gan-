[package]
name = "gan-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Gan v2 çekirdeği: z.ai (GLM) chat completions API istemcisi, akış (streaming), oturum yönetimi ve yerel depolama."
license = "MIT"

[lib]
name = "gan_core"
path = "src/lib.rs"

[dependencies]
# Serileştirme
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async çalışma zamanı
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }   # CancellationToken

# HTTP + TLS (rustls: Android/iOS çapraz derlemede OpenSSL bağımlılığını ortadan kaldırır)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2", "gzip"] }

# Akış yardımcıları
async-stream = "0.3"
futures-core = "0.3"
tokio-stream = "0.1"

# Hata yönetimi
thiserror = "1"

# API anahtarı şifrelemesi (rest'te AES-256-GCM)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Kimlikler
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
